name: SonarQube Cloud Analysis
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis relevance.

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"victorganev_Capstone-Coding"
          /o:"victorganev"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.cs.analyzeRazorCode=true

      - name: Restore dependencies
        run: dotnet restore FinalProjectUI/FinalProject.csproj
        
      - name: Build
        run: dotnet build FinalProjectUI/FinalProject.csproj --no-incremental --no-restore

      - name: End analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
